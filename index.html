<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaje — Expense Tracker</title>
  <meta name="description" content="Yaje — a fast, private, offline-first expense tracker in English and French. Track spending, set budgets and see insights, all on your device. / Suivez vos dépenses, budgets et analyses, en toute confidentialité.">
  <meta name="theme-color" content="#06070D">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yaje">
  <meta name="application-name" content="Yaje">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme before first paint to avoid a flash
    try {
      var s = JSON.parse(localStorage.getItem('yaje.v1') || localStorage.getItem('orbit.v1') || '{}').settings || {};
      var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
      var l = s.lang || ((navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en');
      document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" data-i18n="skip">Skip to content</a>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="shell">
    <nav class="nav" aria-label="Main">
      <div class="brand" aria-hidden="true">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span>Yaje</span>
      </div>
      <a class="nav-item" href="#/home" data-route="home" data-i18n-aria="nav.home"><svg class="i"><use href="#i-home"/></svg><span data-i18n="nav.home">Home</span></a>
      <a class="nav-item" href="#/activity" data-route="activity" data-i18n-aria="route.activity"><svg class="i"><use href="#i-list"/></svg><span data-i18n="route.activity">Activity</span></a>
      <button class="fab" type="button" data-action="add" data-i18n-aria="act.addTx" data-i18n-title="act.addTxKey">
        <svg class="i"><use href="#i-plus"/></svg><span class="fab-label" data-i18n="act.newTx">New transaction</span>
      </button>
      <a class="nav-item" href="#/insights" data-route="insights" data-i18n-aria="route.insights"><svg class="i"><use href="#i-chart"/></svg><span data-i18n="route.insights">Insights</span></a>
      <a class="nav-item" href="#/budgets" data-route="budgets" data-i18n-aria="route.budgets"><svg class="i"><use href="#i-target"/></svg><span data-i18n="route.budgets">Budgets</span></a>
      <a class="nav-item nav-settings" href="#/settings" data-route="settings" data-i18n-aria="route.settings"><svg class="i"><use href="#i-settings"/></svg><span data-i18n="route.settings">Settings</span></a>
      <button class="nav-feedback" type="button" data-action="feedback"><svg class="i"><use href="#i-chat"/></svg><span data-i18n="fb.navLabel">Feedback</span></button>
      <p class="powered nav-powered"><span data-i18n="powered.by">Powered by</span> <strong>Afayi</strong></p>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title">Yaje</h1>
        </div>
        <div class="month-switch" id="monthSwitch">
          <button class="icon-btn" type="button" data-action="month-prev" data-i18n-aria="month.prev"><svg class="i"><use href="#i-left"/></svg></button>
          <button class="month-label" type="button" data-action="month-today" id="monthLabel" ></button>
          <button class="icon-btn" type="button" data-action="month-next" data-i18n-aria="month.next"><svg class="i"><use href="#i-right"/></svg></button>
        </div>
        <a class="icon-btn topbar-settings" href="#/settings" data-i18n-aria="route.settings"><svg class="i"><use href="#i-settings"/></svg></a>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Transaction sheet -->
  <dialog class="sheet" id="txnSheet" aria-labelledby="sheetTitle"></dialog>
  <!-- Generic dialog (confirm / prompt) -->
  <dialog class="modal" id="modal"></dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
